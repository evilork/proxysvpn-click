<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
    <defs>
        <linearGradient id="g" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#4f46e5"/>
            <stop offset="1" stop-color="#818cf8"/>
        </linearGradient>
    </defs>
    <!-- Shield outline -->
    <path d="M32 4 L56 12 L56 32 C56 46 45 56 32 60 C19 56 8 46 8 32 L8 12 Z" fill="url(#g)"/>
    <!-- Lattice dots (ML-KEM lattice problem reference) -->
    <g fill="#fff" opacity="0.95">
        <!-- Row 1 -->
        <circle cx="22" cy="22" r="2"/>
        <circle cx="32" cy="22" r="2"/>
        <circle cx="42" cy="22" r="2"/>
        <!-- Row 2 -->
        <circle cx="22" cy="32" r="2"/>
        <circle cx="32" cy="32" r="2.6"/>
        <circle cx="42" cy="32" r="2"/>
        <!-- Row 3 -->
        <circle cx="22" cy="42" r="2"/>
        <circle cx="32" cy="42" r="2"/>
        <circle cx="42" cy="42" r="2"/>
    </g>
    <!-- Subtle lattice connections -->
    <g stroke="#fff" stroke-width="0.7" opacity="0.35">
        <line x1="22" y1="22" x2="42" y2="22"/>
        <line x1="22" y1="32" x2="42" y2="32"/>
        <line x1="22" y1="42" x2="42" y2="42"/>
        <line x1="22" y1="22" x2="22" y2="42"/>
        <line x1="32" y1="22" x2="32" y2="42"/>
        <line x1="42" y1="22" x2="42" y2="42"/>
    </g>
</svg>
